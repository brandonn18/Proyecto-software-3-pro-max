# Perfil "prod": MySQL. Se activa con SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tickets}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # M-04: el esquema lo manejan las migraciones (db/migration/mysql), no Hibernate
  # M-04: sobre una base que ya tiene tablas pero no el historial de Flyway (la de la EC2, creada con ddl-auto: update),
  # el servicio NO arranca y no toca nada. Para adoptarla, una sola vez y con respaldo previo, ver deploy/DESPLIEGUE.md,
  # paso 10: se arranca con SPRING_FLYWAY_BASELINE_ON_MIGRATE=true (y SPRING_FLYWAY_BASELINE_VERSION=2 si la base ya tiene
  # las columnas de M-01). Una base vacía no necesita nada: Flyway la crea entera.
