server:
  port: ${PORT:8082}

spring:
  application:
    name: domain-service-tickets
  datasource:
    url: jdbc:h2:mem:tickets;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false          # los adaptadores abren su propia transacción; nada de lazy loading en la capa REST
    hibernate:
      # M-04: el esquema lo crean las migraciones de Flyway; Hibernate solo comprueba al arrancar que coincida con las
      # entidades. Si una entidad cambia sin su migración, el servicio no arranca (y las pruebas fallan).
      ddl-auto: validate
  flyway:
    # {vendor} lo reemplaza Spring por h2 o mysql: los tipos de fecha difieren entre bases, así que cada una tiene su
    # carpeta en src/main/resources/db/migration. Toda migración nueva va en las dos, con el mismo número.
    locations: classpath:db/migration/{vendor}

seguridad:
  jwt:
    # Clave COMPARTIDA con AuthCore, en Base64. NO se escribe aquí: se entrega por variable de entorno.
    # Sin esta variable la aplicación no arranca (falla rápido, a propósito).
    secret-base64: ${JWT_SECRET_BASE64}

negocio:
  zona-horaria: America/Bogota
  sla:
    # M-01: cada cuánto se buscan tickets al 80 % del SLA o vencidos (formato ISO-8601: PT1M = 1 minuto).
    intervalo-verificacion: PT1M
