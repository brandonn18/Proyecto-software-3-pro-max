worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Ocultar versión de nginx
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting global
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # authcore: login, usuarios y emisión de JWT
    upstream authcore {
        server authcore:3002;
    }

    # domain-service: tickets, SLA, reportes, notificaciones y Socket.io
    upstream domain {
        server domain-service:3003;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Headers de seguridad HTTP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /internal es solo servicio a servicio: nunca se publica
        location /internal/ {
            return 404;
        }

        # Rate limiting estricto en login
        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://authcore;
        }

        # Autenticación y usuarios → authcore
        location /api/auth/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://authcore;
        }

        location /api/users {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://authcore;
        }

        # Resto de la API (tickets, reports, sla, notifications) → domain-service
        location /api/ {
            limit_req zone=global burst=20 nodelay;
            proxy_pass http://domain;
            proxy_read_timeout 90s;
        }

        # Socket.io → domain-service (emite los eventos de tickets)
        location /socket.io/ {
            proxy_pass http://domain;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Al definir headers aquí no se heredan los del server: se repiten
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Frontend → React SPA
        location / {
            proxy_pass http://frontend;
        }
    }
}
