# Entorno local del AuthCore del grupo (tickets-ti/authcore, Java / Spring Boot) con su PostgreSQL.
#
# El domain service vigente (tickets-ti/domain-service-java) no usa este compose: se ejecuta con Maven
# (ver su README) y en la EC2 con systemd (ver su deploy/DESPLIEGUE.md). El frontend, nginx y el domain
# service Node que orquestaba este archivo se retiraron el 2026-11-26; quedan en la etiqueta
# archivo/pre-limpieza-2026-11.
#
# Secretos: authcore lee su propio .env (no versionado); la clave de la base, de tickets-ti/.env.

services:
  # ── PostgreSQL de authcore (dueño único de la tabla users) ─────────────────
  postgres-authcore:
    image: postgres:15-alpine
    container_name: tickets_postgres_authcore
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHCORE_DB_NAME:-tickets_authcore}
      POSTGRES_USER: ${AUTHCORE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTHCORE_DB_PASSWORD:?Define AUTHCORE_DB_PASSWORD en el entorno o en tickets-ti/.env}
    volumes:
      - postgres-authcore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - authcore-net

  # ── authcore (Java 21 / Spring Boot; Hibernate crea sus tablas al arrancar) ─
  authcore:
    build:
      context: ./authcore
    container_name: tickets_authcore
    restart: unless-stopped
    env_file: ./authcore/.env
    environment:
      PORT: 8081
      DB_HOST: postgres-authcore
      DB_PORT: 5432
      DB_NAME: ${AUTHCORE_DB_NAME:-tickets_authcore}
      DB_USER: ${AUTHCORE_DB_USER:-postgres}
      DB_PASSWORD: ${AUTHCORE_DB_PASSWORD}
      DB_SSLMODE: disable
    depends_on:
      postgres-authcore:
        condition: service_healthy
    networks:
      - authcore-net
    # Sin nginx delante, se publica solo en este equipo.
    ports:
      - "127.0.0.1:8081:8081"

networks:
  authcore-net:
    driver: bridge

volumes:
  postgres-authcore-data:
    driver: local
